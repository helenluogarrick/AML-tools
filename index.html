<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SMB Financial Crime Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: case-management console. Gate tabs across the top, AI output on the left, the officer's decision panel on the right. AI text is tinted violet; human decisions are ink. */
:root{
  --bg:#EEF2F0; --panel:#FFFFFF; --sunk:#E4EAE7; --ink:#14201C; --muted:#56635F; --line:#D2DBD7;
  --accent:#0E5A55; --accent-ink:#FFFFFF; --ai:#5543B0; --ai-bg:#F1EEFC; --ai-line:#D9D2F5;
  --ok:#23704A; --ok-bg:#E3F2EA; --warn:#9A5B00; --warn-bg:#FBF0DC; --bad:#A8231B; --bad-bg:#FBE7E5; --unk:#5F6670; --unk-bg:#ECEEF1;
  --key:#7A4E00; --key-bg:#FFF6D9; --key-line:#EBD48F;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-disp:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1513; --panel:#162020; --sunk:#111917; --ink:#E2E9E6; --muted:#97A49F; --line:#2A3632;
  --accent:#5DBDB2; --accent-ink:#06201D; --ai:#AFA2F7; --ai-bg:#1F1B36; --ai-line:#3A3366;
  --ok:#62C690; --ok-bg:#15301F; --warn:#E5A64C; --warn-bg:#33240D; --bad:#F2847B; --bad-bg:#3A1714; --unk:#A3AAB4; --unk-bg:#232A2E;
  --key:#F1CF73; --key-bg:#2E2610; --key-line:#5C4C1E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1513; --panel:#162020; --sunk:#111917; --ink:#E2E9E6; --muted:#97A49F; --line:#2A3632;
  --accent:#5DBDB2; --accent-ink:#06201D; --ai:#AFA2F7; --ai-bg:#1F1B36; --ai-line:#3A3366;
  --ok:#62C690; --ok-bg:#15301F; --warn:#E5A64C; --warn-bg:#33240D; --bad:#F2847B; --bad-bg:#3A1714; --unk:#A3AAB4; --unk-bg:#232A2E;
  --key:#F1CF73; --key-bg:#2E2610; --key-line:#5C4C1E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.mark{width:30px;height:30px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-disp);font-weight:600;font-size:13px}
.brand h1{font-size:17px}
.brand .env{font-family:var(--f-mono);font-size:11px;color:var(--warn);background:var(--warn-bg);padding:1px 6px;border-radius:4px;margin-left:6px}
.who{display:flex;align-items:center;gap:6px}
.who input{width:150px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.tbtn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:6px;font-weight:500;font-size:13px}
.tbtn:hover{border-color:var(--accent)}
.tbtn.on{background:var(--key-bg);border-color:var(--key-line);color:var(--key)}

/* gate tabs */
.gates{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding-block:14px 4px}
.gate{position:relative;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gate .g{font-family:var(--f-mono);font-size:11px;color:var(--muted);padding-right:34px}
.gate .t{font-family:var(--f-disp);font-weight:600;font-size:15px}
.gate .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gate.cur{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
.gate.locked{background:var(--sunk);color:var(--muted)}
.gate .prog{font-family:var(--f-mono);font-size:11px;position:absolute;top:9px;right:10px;color:var(--muted)}
@media (max-width:1180px){.gates{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.gates{grid-template-columns:repeat(2,minmax(0,1fr))}.top{position:static}}

/* main grid */
.view{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;padding-block:12px 40px;align-items:start}
@media (max-width:980px){.view{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h2{font-size:16px;margin-bottom:4px}
.panel>.sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.dec{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:980px){.dec{position:static}}

/* tool header */
.toolhead{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;justify-content:space-between}
.toolhead h2{font-size:22px}
.toolhead .role{font-size:13px;color:var(--muted);max-width:60ch}
.runbtn{border:1px solid var(--ai);color:var(--ai);background:var(--ai-bg);padding:7px 14px;border-radius:6px;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.runbtn:disabled{opacity:.6;cursor:progress}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.runlog{font-family:var(--f-mono);font-size:12px;color:var(--ai);background:var(--ai-bg);border:1px dashed var(--ai-line);border-radius:6px;padding:8px 10px;margin-top:10px}
.runlog div{white-space:pre-wrap}
.brief{background:var(--sunk);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-top:12px}

/* AI output */
.aibox{background:var(--ai-bg);border:1px solid var(--ai-line);border-radius:10px;padding:4px 14px 14px}
.aibox .aihd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0 6px;font-family:var(--f-mono);font-size:11.5px;color:var(--ai)}
.claim{border-top:1px solid var(--ai-line);padding:12px 0 4px;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 10px}
.claim:first-of-type{border-top:0}
.claim .n{font-family:var(--f-mono);color:var(--ai);font-size:12px;padding-top:2px}
.claim .txt{color:var(--ink)}
.claim .txt .aitext{color:var(--ai);font-weight:500}
:root .claim .txt .aitext{color:color-mix(in srgb,var(--ai) 70%,var(--ink))}
.claim.hidden{display:none}
.cites{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.cite{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--ai-line);background:var(--panel);color:var(--ai);border-radius:4px;padding:1px 7px}
.cite:hover{border-color:var(--ai)}
.cite.none{border-style:dashed;color:var(--muted);cursor:default}
.judge{grid-column:2;display:flex;flex-direction:column;gap:6px;margin-top:6px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.vrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:500}
.vbtn[data-v="S"].on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.vbtn[data-v="P"].on{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.vbtn[data-v="N"].on{background:var(--unk-bg);border-color:var(--unk);color:var(--unk)}
.vbtn[data-v="C"].on{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.note{width:100%;min-height:34px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);resize:vertical;font-size:13px}
.key{background:var(--key-bg);border:1px solid var(--key-line);color:var(--ink);border-radius:6px;padding:7px 9px;font-size:12.5px}
.key b.k{color:var(--key);font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:6px}
.match{font-family:var(--f-mono);font-size:11px;margin-left:6px}
.match.y{color:var(--ok)}.match.n{color:var(--bad)}

/* forms in decision panel */
.sec{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:flex;flex-direction:column;gap:8px}
.sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sec h3{font-size:14px}
.sec .hint{font-size:12.5px;color:var(--muted);margin:0}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;font-size:13px;background:var(--panel);cursor:pointer}
.opt input{margin:0;accent-color:var(--accent)}
.opt:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.fld{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-size:13px}
textarea.fld{min-height:60px;resize:vertical}
.addrow{align-self:flex-start;border:1px dashed var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:4px 10px;font-size:12.5px;font-weight:500}
.rowcard{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;gap:6px;background:var(--bg);position:relative}
.rowcard .x{position:absolute;top:4px;right:6px;border:0;background:none;color:var(--muted);font-size:16px;line-height:1}
.rowcard label.small{display:flex;flex-direction:column;gap:3px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
@media (max-width:520px){.grid2{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid currentColor}
.pill.ok{color:var(--ok);background:var(--ok-bg)}.pill.warn{color:var(--warn);background:var(--warn-bg)}.pill.bad{color:var(--bad);background:var(--bad-bg)}.pill.unk{color:var(--unk);background:var(--unk-bg)}
.chk{display:flex;flex-direction:column;gap:5px}
.chk label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}
.chk .w{color:var(--muted);font-size:12px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:600;background:var(--sunk)}

/* bars */
.bars{display:flex;flex-direction:column;gap:5px}
.bar{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 48px;gap:8px;align-items:center;font-size:12.5px}
.bar .track{display:block;height:10px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--ai);border-radius:3px}
.bar .v{font-family:var(--f-mono);text-align:right;font-size:12px}
.gauge{position:relative;height:16px;background:linear-gradient(90deg,var(--ok-bg) 0 30%,var(--warn-bg) 30% 75%,var(--bad-bg) 75% 100%);border-radius:4px;border:1px solid var(--line);margin:22px 0 18px}
.gauge .tick{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted)}
.gauge .tick span{position:absolute;top:18px;left:-12px;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.gauge .ptr{position:absolute;top:-20px;transform:translateX(-50%);font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ai)}
.gauge .ptr::after{content:"";position:absolute;left:50%;top:16px;width:2px;height:22px;background:var(--ai);transform:translateX(-50%)}

/* screen */
.hit{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel);display:flex;flex-direction:column;gap:10px}
.hit .hd{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline}
.hit .hd h3{font-size:15px}
.rec{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px}
.rec.clear{background:var(--ok-bg);color:var(--ok)}.rec.esc{background:var(--bad-bg);color:var(--bad)}
.chunk{border-left:3px solid var(--ai-line);padding:4px 10px;font-size:13px;background:var(--panel)}
.chunk .sim{font-family:var(--f-mono);font-size:11px;color:var(--ai)}
.chunk.out{border-left-color:var(--line);color:var(--muted)}
details>summary{cursor:pointer;font-size:12.5px;color:var(--ai);font-weight:500}
select.fld{padding:4px 6px}
.idg select{min-width:96px}

/* search */
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0}
.hits{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.shit{border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12.5px;background:var(--bg);text-align:left}
.shit mark{background:var(--key-bg);color:var(--ink);padding:0 1px}

/* agent pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:stretch}
@media (max-width:700px){.pipe{grid-template-columns:repeat(2,minmax(0,1fr))}}
.node{border:1px solid var(--ai-line);background:var(--panel);border-radius:8px;padding:8px;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.node .nm{font-family:var(--f-disp);font-weight:600;font-size:13.5px;color:var(--ai)}
.node .st{font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.node.cur{border-color:var(--ai);box-shadow:inset 0 -3px 0 var(--ai)}
.node.done .st{color:var(--ok)}
.scores{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.score{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.score .big{font-family:var(--f-mono);font-size:26px;font-weight:500;color:var(--ai)}
.sent{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;color:var(--ai)}
.sent:hover{border-color:var(--ai-line);background:var(--panel)}
.sent.flagged{background:var(--bad-bg);color:var(--ink);border-color:var(--bad)}
.tags{display:flex;flex-wrap:wrap;gap:5px;padding:2px 8px 8px}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11.5px;background:var(--panel)}
.tag.on{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.lint{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12.5px}
.lint .hitw{font-family:var(--f-mono);font-size:11.5px;color:var(--bad);background:var(--bad-bg);border-radius:4px;padding:0 6px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 38%,transparent);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);z-index:41;border-left:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer .dh h2{font-size:17px}
.drawer .db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.close{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px}
.doc{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--bg);font-size:13.5px}
.doc p{margin:0 0 8px}
.doc p:last-child{margin:0}
.prov{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:1px 7px;border-radius:4px;margin-right:4px}
.prov.ind{background:var(--ok-bg);color:var(--ok)}.prov.cust{background:var(--warn-bg);color:var(--warn)}.prov.int{background:var(--unk-bg);color:var(--unk)}.prov.ai{background:var(--ai-bg);color:var(--ai)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,calc(100% - 32px));max-height:calc(100% - 64px);background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:42;display:flex;flex-direction:column}
.modal .db{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.modal .dh{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.c4pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:11.5px;background:var(--sunk);border-radius:6px;padding:10px;margin:8px 0 0;max-height:360px;overflow:auto}
.c4row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.c4row .tbtn{flex:none}
.logtxt{width:100%;min-height:340px;font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px}
.pin{display:flex;gap:8px;align-items:center}
.pin input{width:120px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:50;font-size:13px}
.lockview{max-width:520px;margin:40px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.lockview .pin input{text-align:center;letter-spacing:.2em}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px}
footer .wrap{padding-block:14px;display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:space-between}
.facbar{background:var(--key-bg);border-bottom:1px solid var(--key-line);color:var(--key);font-size:12.5px}
.facbar .wrap{padding-block:6px;display:flex;flex-wrap:wrap;gap:6px 16px}
.aibox.hum{background:var(--sunk);border-color:var(--line)}
.aibox.hum .aihd,.aibox.hum .claim .n{color:var(--muted)}
.aibox.hum .claim{border-top-color:var(--line)}
.aibox.hum .claim .txt .aitext{color:var(--ink)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid3 label{display:flex;flex-direction:column;gap:3px}
.grid2 label.small{display:flex;flex-direction:column;gap:3px}
.frac{display:inline-flex;align-items:center;gap:4px}
.frac input{width:78px}
table.kri td{vertical-align:middle}
table.kri select.rag{min-width:84px}
.chart{width:100%;min-width:420px;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-family:var(--f-mono);font-size:10.5px}
.chart .ax.strong{fill:var(--bad);font-weight:600}
.chart .ref{stroke:var(--bad);stroke-dasharray:4 3;stroke-width:1}
.b-h{fill:var(--accent);background:var(--accent)}
.b-a{fill:var(--ai);background:var(--ai)}
.chart .ln-w{fill:none;stroke:var(--warn);stroke-width:2}
.chart .dt-w{fill:var(--warn)}
.chart .ln-m{fill:none;stroke:var(--muted);stroke-width:2}
.chart .dt-m{fill:var(--muted)}
.chart .ln-b{fill:none;stroke:var(--bad);stroke-width:2.5}
.chart .dt-b{fill:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:2px}
.legend .sw.ln-w{height:3px;background:var(--warn)}
.legend .sw.ln-m{height:3px;background:var(--muted)}
.legend .sw.ln-b{height:3px;background:var(--bad)}
.cibar{position:relative;height:22px;background:var(--sunk);border-radius:4px;margin:26px 0 8px}
.cirange{position:absolute;top:4px;bottom:4px;background:var(--ai-line);border:1px solid var(--ai);border-radius:3px}
.cipt{position:absolute;top:0;bottom:0;width:3px;background:var(--ai);transform:translateX(-50%)}
.citol{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad)}
.citol b{position:absolute;top:-18px;left:-14px;font-family:var(--f-mono);font-size:11px;color:var(--bad);font-weight:600}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.tl li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:baseline;position:relative}
.tl li::before{content:"";position:absolute;left:-20px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--panel);border:2px solid var(--accent)}
.tl li:last-child::before{background:var(--bad);border-color:var(--bad)}
.tlb{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;font-size:13px}
.tlb:hover{border-color:var(--accent)}
details>summary h3,.sec details>summary{font-family:var(--f-disp);font-weight:600;font-size:14px;color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fadein{animation:fi .35s ease both}
@keyframes fi{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
</style>

function progress(tool){

/* ---------------- run animation ---------------- */
let running=null;
function runTool(tool){
  const T=TOOLS[tool]; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  running=tool; render();
  const logEl=$('#runlog'); const claims=[...document.querySelectorAll('#aiout .claim')];
  claims.forEach(c=>c.classList.add('hidden'));
  let i=0; const step=reduce?0:330;
  const tick=()=>{
    if(i<T.log.length){const d=document.createElement('div');d.textContent='› '+T.log[i];logEl.appendChild(d);i++;setTimeout(tick,step);return;}
    let j=0;const show=()=>{if(j<claims.length){claims[j].classList.remove('hidden');claims[j].classList.add('fadein');j++;setTimeout(show,reduce?0:240);}else{running=null;S.ran[tool]=true;save();const b=$('#run');if(b){b.disabled=false;b.textContent='Re-run '+T.name;}}};
    show();
  };
  tick();
}
function toolHead(tool,extra){
  const T=TOOLS[tool];
  return `<section class="panel"><div class="toolhead"><div><div class="lab">${T.lbl?T.lbl:'Case 1 · Gate '+T.gate} · ${esc(T.date)} · You are the ${esc(T.seat)}</div><h2>${esc(T.name)} <span class="muted" style="font-size:14px;font-weight:500">${esc(T.kind)}</span></h2><p class="role">${esc(T.role)}</p></div>
  ${T.log.length?`<button class="runbtn" id="run" type="button" ${running?'disabled':''}>${running===tool?'Running…':(S.ran[tool]?'Re-run ':'Run ')+esc(T.name)}</button>`:''}</div>
  <div class="meta">${T.meta.map(m=>`<span>${esc(m[0])}: <b>${esc(m[1])}</b></span>`).join('')}</div>
  <div class="runlog" id="runlog" ${running===tool?'':'hidden'}></div>${extra||''}</section>`;
}

function bars(items,total){
  const max=Math.max(...items.map(i=>Math.abs(i[1])),0.01);
  return `<div class="bars">${items.map(([l,v,n])=>`<div class="bar"><span>${esc(l)}${n?` <span class="muted small">(${esc(n)})</span>`:''}</span><span class="track"><span class="fill" style="width:${Math.abs(v)/max*100}%;${v<0?'background:var(--ok)':''}"></span></span><span class="v">${v>0?'+':''}${v.toFixed(2)}</span></div>`).join('')}<div class="bar" style="font-weight:600"><span>Score</span><span></span><span class="v">${total.toFixed(2)}</span></div></div>`;
}

function fuCheck(){

  const ai=r.filter(x=>x.ai).length; if(ai<2) issues.push(`${ai} of 2 AI-tool actions`);
  r.forEach((x,i)=>{const p=[];if(!x.a)p.push('action');if(!x.o)p.push('owner');else if(/team|\/|\band\b|,|tbc|tbd|all\b/i.test(x.o))p.push('one named owner');if(!x.d)p.push('date');if(!x.e||x.e.length<10)p.push('checkable evidence');if(p.length)issues.push(`#${i+1} needs ${p.join(', ')}`);});
  return issues;

function ciBlock(prefix,defK,defN,tol,label){

function ciOut(k,n,t){
  const r=wilson(k,n); if(!r) return '<p class="small muted">Enter a count no larger than the sample.</p>';

}

    if(t==='mi'){L.push('October KRIs:');KRIS.forEach(([id,l,h,ty])=>L.push(`- ${l}: ${ty==='r'?(D(id+'_n')||'—')+' / '+(D(id+'_d')||'—')+(kriVal(id)?' = '+kriVal(id):''):(D(id+'_v')||'—')} · RAG ${D(id+'_rag')||'—'}`));

document.addEventListener('click',e=>{

  if(ds.close){closeLayer();return;}
  if(el.id==='run'){runTool(S.tool);return;}
  if(el.id==='bMatrix'){openMatrix();return;}
  if(el.id==='bSearch'){openSearch();return;}
  if(el.id==='bLog'){openLog();return;}
  if(el.id==='bFac'){openFac();return;}
  if(el.id==='bReset'){openReset();return;}
  if(ds.copy){c4Copy(ds.copy);return;}
  if(el.id==='cpStarter'){if(D('cp_ins')){toast('Clear the box first to insert the starter');return;}S.d.cp_ins=C4.starter;save();render();return;}
  if(el.id==='doReset'){S=FRESH();save();closeLayer();go('kyc');toast('Answers cleared');return;}
  if(el.id==='copyLog'){const t=$('#logtxt');navigator.clipboard&&navigator.clipboard.writeText(t.value).then(()=>toast('Copied'),()=>{t.select();toast('Press Ctrl or Cmd + C to copy');});if(!navigator.clipboard){t.select();toast('Press Ctrl or Cmd + C to copy');}return;}
  if(ds.tool){go(ds.tool);return;}
  if(ds.doc){openDoc(ds.doc);return;}
  if(ds.claim){const c=S.v[ds.claim]||(S.v[ds.claim]={});c.v=c.v===ds.v?null:ds.v;save();render();return;}
  if(ds.node){S.node=ds.node;save();render();return;}
  if(ds.sent){S.open=S.open===ds.sent?null:ds.sent;const tags=el.parentElement.querySelector('.tags');if(tags)tags.hidden=!tags.hidden;return;}
  if(ds.tag){const [id,tg]=ds.tag.split('|');const f=S.flags[id]||(S.flags[id]=[]);const i=f.indexOf(tg);i<0?f.push(tg):f.splice(i,1);S.open=id;save();render();return;}
  if(ds.addrow){rows(ds.addrow).push({});save();render();return;}
  if(ds.delrow){const [k,i]=ds.delrow.split('|');rows(k).splice(+i,1);save();render();return;}
});

  if(ds.d && el.type!=='radio'){S.d[ds.d]=el.value;save();
    if(ds.live&&LIVE[ds.live]){LIVE[ds.live](el);return;}
    if(ds.lint){const lh=lintHits(el.value);$('#lint').innerHTML=(lh.length?`<span class="pill bad">${lh.length} risky term${lh.length>1?'s':''}</span>${lh.map(w=>`<span class="hitw">${esc(w)}</span>`).join('')}`:'<span class="pill ok">No flagged terms</span>')+'<span class="muted small">A word check is a prompt, not a clearance. Compliance reviews before it goes.</span>';}
    return;}
  if(ds.row){const [k,i,f]=ds.row.split('|');rows(k)[+i][f]=el.value;save();if(k==='fu')refreshFu();refreshChecks(k);return;}
});
function refreshChecks(k){const m={cont:['#contchk',contCheck,'Containment actions are specific'],chain:['#chainchk',chainCheck,'Every cause has evidence'],plan:['#planchk',planCheck,'Every action is accountable and checkable']}[k];if(m&&$(m[0]))$(m[0]).innerHTML=pills(m[1](),m[2]);}
function refreshFu(){const box=$('#fuchk');if(!box)return;const fu=fuCheck();box.innerHTML=fu.length?fu.map(i=>`<span class="pill warn" style="margin:2px 4px 2px 0">${esc(i)}</span>`).join(''):'<span class="pill ok">All actions measurable</span>';}
document.addEventListener('change',e=>{
  const el=e.target, ds=el.dataset;
  if(ds.d && el.type==='radio'){S.d[ds.d]=el.value;save();if(ds.rerender)render();return;}
  if(ds.dm){const cur=new Set(S.d[ds.dm]||[]);el.checked?cur.add(el.value):cur.delete(el.value);S.d[ds.dm]=[...cur];save();return;}
  if(ds.tx){S.sel[ds.tx]=el.checked;save();render();return;}
  if(el.id==='ingest'){S.ingest=el.checked;save();render();return;}
  if(ds.rowcb){const [k,i,f]=ds.rowcb.split('|');rows(k)[+i][f]=el.checked;save();refreshFu();refreshChecks(k);return;}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='gateform'){const g=TOOLS[S.tool].gate;const v=$('#gatecode').value.trim();if(v===CODES[g]){S.un[g]=true;save();render();toast((TOOLS[S.tool].lbl?TOOLS[S.tool].lbl.replace('CASE','Case'):'Gate '+g)+' open');}else{$('#gatemsg').textContent='That code does not open this gate. Check it with your facilitator.';}}
  if(e.target.id==='facform'){if($('#facpin').value.trim()===FAC_PIN){S.fac=true;save();closeLayer();render();toast('Facilitator mode on');}else{$('#facmsg').textContent='Wrong PIN.';}}
  if(e.target.id==='sform'){doSearch($('#sq').value);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLayer();});
function fromHash(){const h=location.hash.slice(1);if(TOOLS[h]&&h!==S.tool){S.tool=h;save();render();}}
window.addEventListener('hashchange',fromHash);
const h0=location.hash.slice(1); if(TOOLS[h0]) S.tool=h0;
render();
})();
</script>
